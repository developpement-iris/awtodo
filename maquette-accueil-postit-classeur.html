<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Watodo — Accueil (post-it + classeur)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #241C1C; --surface: #332828; --surface-raised: #3D2F2F; --border: #4A3838;
    --ink: #EDE3DF; --ink-muted: #B0A19D; --ink-faint: #7A6D6A;
    --accent: #8F4040; --accent-strong: #A34E4E; --accent-contrast: #FFFFFF;
    --pr-haute: #C2691F; --pr-haute-bg: #332212;
    --incident: #5B8A8A; --incident-bg: #1D2C2C;
    --incident-live: #6FA3A3; --incident-live-bg: #223838;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Bricolage Grotesque', sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1180px; margin: 0 auto; padding: 30px 30px 80px; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom: 34px; }
  .brand { font-weight: 800; font-size: 22px; }

  /* ─── Backlog — évoque un post-it sans être littéral ─── */
  .postit-wrap { display:flex; justify-content:center; margin: 10px 0 44px; }
  .postit {
    position: relative;
    background: var(--surface-raised);
    color: var(--ink);
    width: 380px;
    padding: 22px 24px 26px;
    border: 1px solid var(--border);
    border-radius: 3px 14px 14px 14px;
    transform: rotate(-1.4deg);
    box-shadow: 0 14px 26px rgba(0,0,0,.32), 0 2px 6px rgba(0,0,0,.18);
  }
  .postit::before {
    /* pli de coin, discret, dans la teinte de la carte */
    content:"";
    position:absolute; right:0; bottom:0;
    width:0; height:0;
    border-style:solid;
    border-width:0 0 20px 20px;
    border-color: transparent transparent rgba(0,0,0,.28) transparent;
    border-bottom-right-radius: 14px;
  }
  .postit h2 { margin:0 0 14px; font-family:'Bricolage Grotesque',sans-serif; font-size: 17px; font-weight:800; letter-spacing:-0.01em; color: var(--accent-strong); }
  .postit ul { list-style:none; margin:0; padding:0; }
  .postit li { display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:13.5px; font-weight:500; padding:9px 0; border-bottom: 1px dashed var(--border); }
  .postit li:last-child{ border-bottom:none; }
  .postit .chip {
    font-family:'IBM Plex Mono',sans-serif; font-size:10.5px; font-weight:700;
    padding:2px 8px; border-radius:999px; white-space:nowrap; text-transform:uppercase; letter-spacing:.02em;
  }

  /* ─── Classeur / onglets ─── */
  .classeur-label { font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); margin: 0 0 6px 8px; }
  .classeur { position: relative; }
  .tabs-row { display:flex; gap:6px; padding-left: 18px; }
  .tab {
    flex:1; max-width:190px;
    background: var(--tab-color, var(--surface-raised));
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 12px 12px 0 0;
    padding: 14px 16px 20px;
    cursor: pointer;
    position: relative;
    top: 10px;
    transition: top .16s ease, box-shadow .16s ease;
    box-shadow: 0 -2px 0 rgba(255,255,255,0.02) inset;
  }
  .tab:nth-child(even) { top: 0px; }
  .tab:hover { top: -4px; box-shadow: 0 -10px 18px rgba(0,0,0,.28); }
  .tab .ic { margin-bottom: 8px; opacity:.9; }
  .tab .name { font-weight:700; font-size:14px; margin-bottom:2px; }
  .tab .sub { font-size:11px; color:var(--ink-muted); }

  .folder-body {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0 12px 12px 12px;
    height: 30px;
    position: relative;
    box-shadow: 0 10px 24px rgba(0,0,0,.3);
  }
  .folder-body::before, .folder-body::after, .folder-body .hole3 {
    content:""; position:absolute; top:50%; transform:translateY(-50%);
    width:9px; height:9px; border-radius:50%; background: var(--bg);
    border: 1px solid var(--border);
  }
  .folder-body::before { left: 16px; }
  .folder-body .hole3 { left: 50%; transform: translate(-50%,-50%); }
  .folder-body::after { right: 16px; }
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand">Watodo</div>
  </div>

  <div class="postit-wrap">
    <div class="postit">
      <h2>Backlog</h2>
      <ul>
        <li>Faire ceci <span class="chip" style="background:var(--pr-haute-bg); color:var(--pr-haute);">Haute</span></li>
        <li>Verif incident sans projet <span class="chip" style="background:var(--incident-bg); color:var(--incident);">Signalé</span></li>
        <li>Verif E2E incident <span class="chip" style="background:var(--incident-bg); color:var(--incident);">Signalé</span></li>
        <li>Erreur 500 sur /login <span class="chip" style="background:var(--incident-live-bg); color:var(--incident-live);">En cours</span></li>
      </ul>
    </div>
  </div>

  <div class="classeur-label">Accès rapide</div>
  <div class="classeur">
    <div class="tabs-row">
      <div class="tab" style="--tab-color:#3D2F2F">
        <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg></div>
        <div class="name">Projets</div>
        <div class="sub">5 au total</div>
      </div>
      <div class="tab" style="--tab-color:#3D3226">
        <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div>
        <div class="name">Tâches</div>
        <div class="sub">Liste et filtres</div>
      </div>
      <div class="tab" style="--tab-color:#223838; color:var(--incident-live)">
        <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4M12 17h.01"/></svg></div>
        <div class="name" style="color:var(--ink)">Incidents</div>
        <div class="sub">3 actifs</div>
      </div>
      <div class="tab" style="--tab-color:#332B14">
        <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18M7 15l4-6 4 3 5-8"/></svg></div>
        <div class="name">Statistiques</div>
        <div class="sub">Vue d'ensemble</div>
      </div>
      <div class="tab" style="--tab-color:#3D2F2F">
        <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg></div>
        <div class="name">Administration</div>
        <div class="sub">Comptes, groupes</div>
      </div>
    </div>
    <div class="folder-body"><div class="hole3"></div></div>
  </div>
</div>
</body>
</html>
