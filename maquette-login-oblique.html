<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Watodo — Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #8F4040; --accent-strong: #A34E4E; --cream: #F5E7E3;
    --beige: #F5EFEC; --beige-card: #FFFFFF; --beige-border: #E6DAD4;
    --ink: #2A2020; --ink-muted: #6B5C58;
    --seam: #C2691F;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Bricolage Grotesque', sans-serif; height: 100vh; overflow: hidden; }

  .login-screen { position: relative; width: 100%; height: 100vh; background: var(--beige); }

  .panel-left {
    position: absolute; inset: 0;
    background: linear-gradient(150deg, #A34E4E 0%, var(--accent) 55%, #6E2F2F 100%);
    clip-path: polygon(0 0, 39% 0, 31% 100%, 0 100%);
  }
  .panel-seam {
    position: absolute; inset: 0;
    background: var(--seam);
    clip-path: polygon(39% 0, 41.6% 0, 33.6% 100%, 31% 100%);
  }
  .panel-right {
    position: absolute; inset: 0;
    background: var(--beige);
    clip-path: polygon(41.6% 0, 100% 0, 100% 100%, 33.6% 100%);
  }

  /* Contenu — positionné indépendamment des calques de fond, jamais rogné par leur clip-path */
  .content-left {
    position: absolute; top: 0; left: 0; width: 30%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    padding: 0 20px; z-index: 2;
  }
  .content-right {
    position: absolute; top: 0; left: 40%; width: 60%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
  }

  .left-content { display:flex; flex-direction:column; align-items:center; gap: 22px; padding: 0 24px; }
  .anim-wrap svg { width: min(26vw, 260px); height: auto; overflow: visible; }
  .tagline { font-size: 15px; font-weight: 600; color: var(--cream); text-align:center; max-width: 260px; line-height: 1.5; opacity: 0; animation: fadeIn .6s ease forwards; animation-delay: 1.6s; }
  @keyframes fadeIn { to { opacity: 1; } }
  #letterPath { fill:none; stroke: var(--cream); stroke-width: 110; stroke-linecap: round; stroke-linejoin: round; }
  #dot { fill: var(--cream); opacity:0; transform-box: fill-box; transform-origin:center; }
  #dot.jump { animation: dotJump .62s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes dotJump {
    0% { opacity:0; transform: translateY(-190px) scale(.6); }
    55% { opacity:1; transform: translateY(14px) scale(1.05); }
    75% { transform: translateY(-8px) scale(.98); }
    100% { opacity:1; transform: translateY(0) scale(1); }
  }

  /* ── Formulaire login ── */
  .login-card { width: 340px; }
  .login-title { font-size: 26px; font-weight: 800; color: var(--ink); margin: 0 0 6px; letter-spacing:-0.01em; }
  .login-sub { font-size: 13.5px; color: var(--ink-muted); margin: 0 0 32px; }

  .field { margin-bottom: 16px; }
  .field label { display:block; font-size: 12px; font-weight: 600; color: var(--ink-muted); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 11px 14px; border-radius: 8px;
    border: 1px solid var(--beige-border); background: var(--beige-card);
    font-family: inherit; font-size: 14px; color: var(--ink);
  }
  .field input:focus { outline:none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(143,64,64,.12); }

  .btn-primary {
    width:100%; padding: 12px; border-radius: 8px; border:none;
    background: var(--accent); color: #fff; font-family:'IBM Plex Mono',monospace;
    font-weight:700; font-size: 13px; cursor:pointer; margin-top: 6px;
  }
  .btn-primary:hover { background: var(--accent-strong); }

  .divider { display:flex; align-items:center; gap:12px; margin: 22px 0; color: var(--ink-muted); font-size: 12px; font-family:'IBM Plex Mono',monospace; }
  .divider::before, .divider::after { content:""; flex:1; height:1px; background: var(--beige-border); }

  .btn-sso {
    width:100%; padding: 11px; border-radius: 8px; border:1px solid var(--beige-border);
    background: var(--beige-card); color: var(--ink); font-family: 'Bricolage Grotesque', sans-serif;
    font-weight:600; font-size: 13.5px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .btn-sso:hover { background: var(--beige); }
  .ms-logo { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; width:15px; height:15px; gap:1.5px; flex:none; }
  .ms-logo span:nth-child(1){background:#F35325;} .ms-logo span:nth-child(2){background:#81BC06;}
  .ms-logo span:nth-child(3){background:#05A6F0;} .ms-logo span:nth-child(4){background:#FFBA08;}
</style>
</head>
<body>

<div class="login-screen">
  <div class="panel-left"></div>
  <div class="panel-seam"></div>
  <div class="panel-right"></div>

  <div class="content-left">
    <div class="anim-wrap">
      <svg viewBox="0 0 1222 916" xmlns="http://www.w3.org/2000/svg">
        <path id="letterPath" d="
          M 110 250
          C 20 400, 20 610, 130 690
          C 210 750, 300 630, 360 480
          C 395 400, 420 370, 455 415
          C 495 470, 515 610, 560 690
          C 600 750, 660 705, 685 600
          C 705 510, 695 400, 705 320
          C 715 235, 760 140, 860 105
          C 955 70, 1080 100, 1115 185
          C 1145 255, 1115 325, 1045 345
          C 995 360, 955 335, 945 285
        "/>
        <circle id="dot" cx="895" cy="785" r="58"/>
      </svg>
    </div>
    <div class="tagline">Bienvenue sur Awtodo.<br>Ici, je gère mes projets !</div>
  </div>

  <div class="content-right">
    <div class="login-card">
      <div class="login-title">Bon retour</div>
      <p class="login-sub">Connectez-vous pour accéder à vos projets.</p>

      <div class="field">
        <label>Email professionnel</label>
        <input type="email" placeholder="prenom.nom@entreprise.com">
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" placeholder="••••••••••">
      </div>
      <button class="btn-primary">SE CONNECTER</button>

      <div class="divider">ou</div>

      <button class="btn-sso">
        <span class="ms-logo"><span></span><span></span><span></span><span></span></span>
        Continuer avec Microsoft
      </button>
    </div>
  </div>
</div>

<script>
  const path = document.getElementById('letterPath');
  const dot = document.getElementById('dot');
  const length = path.getTotalLength();
  const DRAW = 1900, HOLD = 1600;
  let timer = null;

  function reset() {
    path.style.transition = 'none';
    path.style.strokeDasharray = length;
    path.style.strokeDashoffset = length;
    dot.classList.remove('jump');
    path.getBoundingClientRect();
  }
  function play() {
    reset();
    requestAnimationFrame(() => {
      path.style.transition = `stroke-dashoffset ${DRAW}ms cubic-bezier(.65,0,.35,1)`;
      path.style.strokeDashoffset = '0';
    });
    setTimeout(() => dot.classList.add('jump'), DRAW - 150);
  }
  function loop() { play(); clearTimeout(timer); timer = setTimeout(loop, DRAW + HOLD); }
  window.addEventListener('load', loop);
</script>
</body>
</html>
